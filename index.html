<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧮@mohd_sajidalam</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0e17;
            overflow: hidden;
            position: relative;
        }

        .liquid-bg {
            position: absolute;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                #0066ff,
                #00c8ff,
                #00ffea,
                #00ff9d
            );
            animation: gradientFlow 25s ease infinite;
            opacity: 0.15;
        }

        @keyframes gradientFlow {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            50% { transform: translate(-30%, -30%) rotate(180deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .calculator {
 
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            border-radius: 40px;
            padding: 25px;
            width: 340px;
            box-shadow: 0 0 60px rgba(0, 200, 255, 0.15);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .calculator::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(0, 255, 255, 0.1) 0%, transparent 70%);
            animation: pulse 8s infinite;
            z-index: -1;
        }

        @keyframes pulse {
 
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.2); opacity: 0.3; }
            100% { transform: scale(0.8); opacity: 0; }
        }

        #display {
            background: transparent;
            border: none;
            color: white;
            font-size: 56px;
            text-align: right;
            padding: 30px 20px;
            width: 100%;
            margin-bottom: 15px;
            font-weight: 300;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
 
            border: none;
            width: 68px;
            height: 68px;
            font-size: 28px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        button:hover {
 
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 200, 255, 0.2);
        }

        button:active {
            transform: scale(0.95);
        }

        .operator {
            background: linear-gradient(145deg, #00b4ff, #0066ff);
            color: white !important;
            font-weight: 500;
        }

        .equals {
            background: linear-gradient(145deg, #00ffaa, #00ccff);
            color: #000 !important;
            border-radius: 35px !important;
            width: 100% !important;
            grid-column: span 2;
        }

        .credit-main {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-weight: 300;
            background: linear-gradient(45deg, #00ffea, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlow 2s ease-in-out infinite alternate;
        }

        .credit-sub {
 
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            text-align: right;
            transition: all 0.3s;
        }

        .credit-sub:hover {
            color: #00ccff;
            transform: translateY(-2px);
        }

        @keyframes textGlow {
            0% { text-shadow: 0 0 10px rgba(0, 200, 255, 0.3); }
            100% { text-shadow: 0 0 20px rgba(0, 200, 255, 0.6); }
        }

        @media (max-width: 480px) {
            .calculator {
                width: 90%;
                padding: 20px;
            }
            button {
                width: 100%;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="liquid-bg"></div>
    
    <div class="credit-main">Designed by SAJID ALAM</div>
 
    <div class="calculator">
        <input type="text" id="display" readonly value="0">
        <div class="buttons">
            <button class="operator" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendOperator('±')">±</button>
            <button class="operator" onclick="appendOperator('%')">%</button>
            <button class="operator" onclick="appendOperator('/')">/</button>
            
            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="appendOperator('*')">×</button>
            
            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="appendOperator('-')">−</button>
            
            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="appendOperator('+')">+</button>
             
            <button onclick="appendNumber('0')" style="grid-column: span 2; width: 100% !important; border-radius: 35px !important;">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>
        </div>
    </div>

    <a href="https://linktr.ee/mohd_sajidalam/" target="_blank" class="credit-sub">
        @mohd_sajidalam<br>
        linktr.ee/mohd_sajidalam
    </a>

    <script>
                let display = document.getElementById('display');
        let currentValue = '0';
        let firstOperand = null;
        let operator = null;
        let waitingForSecondOperand = false;

        function updateDisplay() {
            display.value = currentValue.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }
 
        function appendNumber(num) {
            if (waitingForSecondOperand) {
                currentValue = num;
                waitingForSecondOperand = false;
            } else {
                currentValue = currentValue === '0' ? num : currentValue + num;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (op === '±') {
                currentValue = (parseFloat(currentValue) * -1).toString();
                updateDisplay();
                return;
            }
            
            const inputValue = parseFloat(currentValue.replace(/,/g, ''));
            
            if (operator && waitingForSecondOperand) {
                operator = op;
                return;
            }
 
            
            if (firstOperand === null) {
                firstOperand = inputValue;
            } else if (operator) {
                const result = performCalculation(firstOperand, inputValue, operator);
                currentValue = `${parseFloat(result.toFixed(10))}`;
                firstOperand = result;
                updateDisplay();
            }
            
            operator = op;
            waitingForSecondOperand = true;
        }
 

        function performCalculation(a, b, op) {
            switch(op) {
                case '+': return a + b;
                case '-': return a - b;
                case '*': return a * b;
                case '/': return a / b;
                case '%': return a % b;
                default: return b;
            }
        }
 
        function calculate() {
            if (operator === null || waitingForSecondOperand) return;
            
            const inputValue = parseFloat(currentValue.replace(/,/g, ''));
            const result = performCalculation(firstOperand, inputValue, operator);
            //Made-By-Sajid
            currentValue = `${parseFloat(result.toFixed(10))}`;
            operator = null;
            firstOperand = null;
            waitingForSecondOperand = false;
            updateDisplay();
        }
 
        function clearDisplay() {
            currentValue = '0';
            firstOperand = null;
            operator = null;
            waitingForSecondOperand = false;
            updateDisplay();
        }
    </script>
</body>
</html>
